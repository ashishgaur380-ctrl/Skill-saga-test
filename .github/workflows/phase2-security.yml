name: Skill Saga Phase 2 Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production hardening
        run: node scripts/validate-production-hardening.mjs
