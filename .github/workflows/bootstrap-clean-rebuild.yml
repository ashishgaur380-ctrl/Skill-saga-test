name: Bootstrap from clean rebuild

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event.head_commit.message == 'Initialize test repository' }}
    runs-on: ubuntu-latest
    steps:
      - name: Copy current clean-rebuild state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf source
          git clone --no-single-branch https://github.com/ashishgaur380-ctrl/Skill-saga.git source
          cd source
          git checkout --detach skill-saga-clean-rebuild
          git remote remove origin
          git remote add target https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push target HEAD:main --force
