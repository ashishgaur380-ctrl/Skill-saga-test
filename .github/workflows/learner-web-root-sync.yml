name: Skill Saga UI 2.0 Pages Root Sync

on:
  push:
    branches: [main]
    paths:
      - "apps/learner/**"
      - "shared/firebase/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/learner-web-root-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learner-ui-2-root-sync
  cancel-in-progress: true

jobs:
  publish-root:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: skill-saga-2
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/learner build

      # GitHub Pages is currently serving the repository root. Replace the
      # legacy root learner entry point with the exact frozen UI 2.0 export.
      - name: Publish UI 2.0 export to repository root
        run: |
          rm -f index.html
          cp -R apps/learner/out/. ./
          touch .nojekyll

      - name: Commit published learner UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No UI 2.0 root changes to commit."
            exit 0
          fi
          git commit -m "chore: publish Skill Saga UI 2.0 to Pages root"
          git push
