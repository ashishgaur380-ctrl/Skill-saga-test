function normalizeQuizQuestions(qs){
  if(!Array.isArray(qs))return [];

  return qs.map(function(x){
    if(Array.isArray(x)){
      return [
        String(x[0]||''),
        Array.isArray(x[1])?x[1].map(String):[],
        Number(x[2]||0),
        String(x[3]||'')
      ];
    }

    if(x&&typeof x==='object'){
      return [
        String(x.question||''),
        Array.isArray(x.options)?x.options.map(String):[],
        Number(x.correctIndex??0),
        String(x.explanation||x.feedback||'')
      ];
    }

    return null;
  }).filter(function(x){
    return x&&x[1].length===4;
  });
}

  }
}

function challengeByPlacement(module,destination,type){
  var today=new Date().toISOString().slice(0,10);
  var arr=Array.isArray(local.content)?local.content:[];
  function isLive(x){
    if(!x||x.published===false)return false;
    var pd=x.publishDate||x.date||'';
    return !pd||pd<=today;
  }
  function matches(x){
    if(!isLive(x))return false;
    var p=x.placement||{};
    var m=x.primaryModule||p.module||'';
    var dest=x.primaryDestination||p.destination||'';
    return m===module&&dest===destination;
  }
  var exact=arr.find(matches);
  if(exact)return exact;
  if(type){
    exact=arr.find(function(x){return isLive(x)&&x.type===type&&(x.publishDate||x.date)===today;});
    if(exact)return exact;
    exact=arr.find(function(x){return isLive(x)&&x.type===type&&(x.publishDate||x.date)<=today;});
    if(exact)return exact;
    exact=arr.find(function(x){return isLive(x)&&x.type===type;});
    if(exact)return exact;
  }
  return null;
}

function getAdaptiveDifficulty(skill,topic){
var u=user();
var key=(skill||'General')+'|'+(topic||'General');
var m=(u.mastery||{})[key];

if(!m)return 'Easy';

var accuracy=Number(m.lastAccuracy||m.accuracy||0);
var mastery=Number(m.mastery||0);
var score=Math.round((accuracy*0.6)+(mastery*0.4));

if(score<40)return 'Easy';
if(score<60)return 'Medium';
if(score<80)return 'Medium';
if(score<90)return 'Hard';
return 'Hard';
}

function getUnlockedLevels(skill,topic){
var u=user();
var key=(skill||'General')+'|'+(topic||'General');
var m=(u.mastery||{})[key];
var mastery=m?Number(m.mastery||0):0;
var attempts=m?Number(m.attempts||0):0;

var unlocked=['Basic'];

if(attempts>=1 && mastery>=40) unlocked.push('Foundation');
if(attempts>=2 && mastery>=60) unlocked.push('Intermediate');
if(attempts>=3 && mastery>=75) unlocked.push('Advanced');
if(attempts>=4 && mastery>=90) unlocked.push('Expert');

return unlocked;
}

function skills(){

  var level=Number(u.level||1);

    ['➗','Numerical'],
    ['🧩','Reasoning'],

    ['⏱️','Speed'],
    ['🎯','Accuracy'],
    ['🧠','Memory'],
    ['📖','Vocabulary'],
    ['🧪','Scientific Thinking']
  ];

  function score(name){
    if(u.skillScores &&
       typeof u.skillScores[name]==='number'){
      return Math.round(Math.max(0,Math.min(100,u.skillScores[name])));
    }
    return null;
  }

  var rows=skillList.map(function(x){
    return {
      icon:x[0],

    };

    return x.score!==null;
  });

  var strongest=assessed.length
    ? assessed.slice().sort(function(a,b){return b.score-a.score;})[0]
    : null;

  var needs=assessed.length
    ? assessed.slice().sort(function(a,b){return a.score-b.score;})[0]
    : null;

  var growing=null;

    var growth=Object.values(u.mastery).filter(function(m){
      return m &&
        typeof m.improvement==='number' &&
        m.improvement>0;
    });

    growth.sort(function(a,b){
      return Number(b.improvement||0)-Number(a.improvement||0);
    });

    if(growth.length){
      growing={
        name:growth[0].skill||'Skill',

  var mastery=[];

      .filter(function(m){
        return m && typeof m==='object';

      .sort(function(a,b){
        return Number(b.mastery||0)-Number(a.mastery||0);
      })
      .slice(0,4);

async function claimReward(name,cost){
  var u=ensureUserData(user());

  if(u.badges.includes(name)){
    return toast('Already unlocked');
  }

  if(cost>0 && (u.coins||0)<cost){
    return toast('Not enough Skill Saga Coins yet');
  }

  if(cost>0)u.coins-=cost;

  u.badges.push(name);
  await persistUser(u);

  toast('🏅 Achievement unlocked!');
  rewardsScreen();
}


function history(){
  var u=ensureUserData(user());
  var h=Array.isArray(u.history)?u.history:[];

  var rows='';
  if(!h.length){
    rows='<div class="card center" style="margin-top:15px"><div style="font-size:50px">📚</div><h3>No quiz history yet</h3><p class="muted">Complete your first challenge and your results will appear here.</p><button class="btn" onclick="go(\'play\')">Start Learning</button></div>';
  }else{
    rows=h.map(function(x,i){
      var d=new Date(x.date);
      var date=isNaN(d.getTime())?'':d.toLocaleDateString();
      var pct=Number(x.percentage);
      if(!Number.isFinite(pct)){
        pct=x.total?Math.round((Number(x.score||0)/Number(x.total))*100):0;
      }

      return '<button class="card" style="width:100%;text-align:left;border:0;margin:10px 0;cursor:pointer" onclick="showQuizAttemptDetail('+i+')">'+
        '<div class="row"><b>'+esc(x.title||'Quiz')+'</b><span class="badge">'+date+'</span></div>'+
        '<p class="muted">'+Number(x.score||0)+'/'+Number(x.total||0)+' correct • '+pct+'% accuracy</p>'+
        '<div class="row"><span>XP earned</span><b>+'+(x.studentXp||x.xp||0)+'</b><span style="margin-left:auto">View Details →</span></div>'+
      '</button>';
    }).join('');
  }

  shell(
    '<div class="row"><h1>Quiz History</h1><span>📚</span></div>'+
    '<div class="muted">Review your recent learning performance.</div>'+
    '<div class="section"><b>Recent Attempts</b></div>'+
    rows
  );
}

function showQuizAttemptDetail(index){
  var u=ensureUserData(user());
  var h=Array.isArray(u.history)?u.history:[];
  var x=h[Number(index)];

  if(!x)return toast('Attempt not found');

  var pct=Number(x.percentage);
  if(!Number.isFinite(pct)){
    pct=x.total?Math.round((Number(x.score||0)/Number(x.total))*100):0;
  }

  var html=
    '<div class="row">'+
      '<button class="back" onclick="history()">‹</button>'+
      '<div><h1 style="margin:0">Attempt Details</h1><div class="muted">'+esc(x.title||'Quiz')+'</div></div>'+
      '<span>📊</span>'+
    '</div>'+
    '<div class="hero" style="margin-top:15px">'+
      '<small>QUIZ RESULT</small>'+
      '<h2>'+Number(x.score||0)+' / '+Number(x.total||0)+'</h2>'+
      '<p>'+pct+'% accuracy • +'+Number(x.studentXp||x.xp||0)+' XP • +'+Number(x.coins||0)+' 🪙</p>'+
    '</div>';

  if(Array.isArray(x.questions)&&x.questions.length){
    html+='<div class="section"><b>Question Review</b></div>';

    x.questions.forEach(function(q,i){
      var r=Array.isArray(x.responses)?x.responses.find(function(z){
        return Number(z.questionIndex)===i;
      }):null;

      var selected=r?Number(r.selected):null;
      var correctIndex=Number(q.correctIndex||0);
      var options=Array.isArray(q.options)?q.options:[];

      html+=
        '<div class="card" style="margin-bottom:10px">'+
          '<b>Q'+(i+1)+'. '+esc(q.question||'Question')+'</b>'+
          '<div class="muted" style="margin-top:8px">Your answer: '+
            (selected!==null&&options[selected]!=null?esc(options[selected]):'Not answered')+
          '</div>'+
          '<div style="margin-top:5px"><b>Correct answer: '+
            (options[correctIndex]!=null?esc(options[correctIndex]):'—')+
          '</b></div>'+
          (q.explanation?'<div class="muted" style="margin-top:7px">'+esc(q.explanation)+'</div>':'')+
          '<div style="margin-top:8px;font-weight:800">'+
            (r&&r.correct?'✓ Correct':'✗ Incorrect')+
          '</div>'+
        '</div>';
    });
  }else{
    html+=
      '<div class="card" style="margin-top:15px">'+
        '<b>Attempt summary</b>'+
        '<p class="muted">Detailed question-by-question answers are not available for this older attempt.</p>'+
      '</div>';
  }

  shell(html);
}

  var name=document.getElementById('profileName').value.trim();
  var cls=document.getElementById('profileClass').value;
  var school=document.getElementById('profileSchool').value.trim();
  var district=document.getElementById('profileDistrict').value.trim();

function progress(){
  var u=ensureUserData(user());
  var history=u.history||[];
  var recent=history.slice(0,7);
  var avg=history.length
    ? Math.round(history.reduce(function(a,x){return a+(x.studentAccuracy||x.accuracy||0)},0)/history.length)
    : 0;

  var chart='';
  if(!recent.length){
    chart='<div class="card center" style="margin-top:15px"><div style="font-size:48px">📈</div><h3>Your progress will appear here</h3><p class="muted">Complete quizzes to build your learning statistics.</p></div>';
  }else{
    chart=recent.map(function(x){
      var value=Math.max(5,Math.min(100,x.accuracy||0));
      return '<div style="margin:14px 0">'+
        '<div class="row"><span>'+esc(x.title||'Quiz')+'</span><b>'+(x.studentAccuracy||x.accuracy||0)+'%</b></div>'+
        '<div class="bar"><i style="width:'+value+'%"></i></div>'+
      '</div>';
    }).join('');
  }

  shell(
    '<div class="row"><button class="back" onclick="go(\'profile\')">‹</button><h1>Progress</h1><span>📊</span></div>'+
    '<div class="grid" style="margin-top:15px">'+
      '<div class="tile"><b>'+u.xp+'</b><small>Total XP</small></div>'+
      '<div class="tile"><b>'+avg+'%</b><small>Average accuracy</small></div>'+
      '<div class="tile"><b>'+u.quizzes+'</b><small>Quizzes</small></div>'+
      '<div class="tile"><b>'+u.streak+' 🔥</b><small>Current streak</small></div>'+
    '</div>'+
    '<div class="section"><b>Recent Accuracy</b></div>'+
    '<div class="card">'+chart+'</div>'+
    '<div class="section"><b>Skill DNA</b></div>'+
    '<div class="card">'+
      '<p class="muted">Your skill levels grow as you complete quizzes and improve your performance.</p>'+
      ['Numerical','Reasoning','Problem Solving','Speed','Accuracy','Memory','Vocabulary','Scientific Thinking'].map(function(name){
        var value=u.skillScores&&typeof u.skillScores[name]==='number'&&u.skillScores[name]>0
          ?Math.round(Math.max(0,Math.min(100,u.skillScores[name])))
          :null;
        return '<div style="margin:12px 0">'+
          '<div class="row"><span>'+name+'</span><b>'+(value===null?'Not assessed':value)+'</b></div>'+
          '<div class="bar"><i style="width:'+(value===null?0:value)+'%"></i></div>'+
        '</div>';
      }).join('')+
    '</div>'+
    '<div class="section"><b>Topic Mastery</b></div>'+
    '<div class="card">'+
      '<p class="muted">Your performance across the skills and topics you have practiced.</p>'+
      (Object.values(u.mastery||{}).length
        ? Object.values(u.mastery||{}).sort(function(a,b){return (b.mastery||0)-(a.mastery||0)}).map(function(m){
            return '<div style="margin-top:14px">'+
              '<div class="row"><b>'+esc(m.skill||'General')+'</b><span class="badge">'+(m.mastery||0)+'% Mastery</span></div>'+
              '<div class="muted" style="font-size:12px;margin-top:3px">'+esc(m.topic||'General')+' • '+(m.attempts||0)+' attempt'+((m.attempts||0)===1?'':'s')+' • Best '+(m.best||0)+'%</div>'+
              '<div class="bar" style="margin-top:7px"><i style="width:'+Math.max(0,Math.min(100,m.mastery||0))+'%"></i></div>'+
              '<div class="muted" style="font-size:11px;margin-top:4px">Latest '+(m.lastAccuracy||0)+'% • Improvement '+((m.improvement||0)>0?'+':'')+(m.improvement||0)+'%</div>'+
            '</div>';
          }).join('')
        : '<p class="muted">Complete a quiz to start building topic mastery.</p>')+
    '</div>');
}

}

async function resetPassword(){
  var emailEl=document.getElementById('email');
  var email=emailEl?emailEl.value.trim().toLowerCase():'';
  if(!email)return toast('Enter your email address first');
  if(!firebaseReady)return toast('Firebase is not connected');
  try{
    await firebase.auth().sendPasswordResetEmail(email);
    toast('Password reset email sent. Check your inbox and spam folder.');
  }catch(err){
    console.error('SKILL SAGA PASSWORD RESET ERROR',err);
    if(err.code==='auth/invalid-email')return toast('Enter a valid email address');
    if(err.code==='auth/too-many-requests')return toast('Too many reset requests. Please try again later.');
    toast('Could not send password reset email. Please check the email address and try again.');
  }
}

function resetPasswordFromSettings(){
  resetPassword();
}

async function loadLinkRequests(){
  var u=user();
  if(!u||u.role!=='learner'||!cloudDb)return [];
  try{
    var snap=await cloudDb.collection('linkRequests')
      .where('toUid','==',cloudUser.uid)
      .where('status','==','pending')
      .get();
    return snap.docs.map(function(d){return {id:d.id,...d.data()}});
  }catch(e){
    console.warn('Link requests load failed',e);
    return [];
  }
}

async function respondLinkRequest(requestId,action){
  var u=user();
  if(!u||u.role!=='learner'||!cloudDb)return toast('Only learners can respond to requests');

  try{
    var ref=cloudDb.collection('linkRequests').doc(requestId);
    var snap=await ref.get();
    if(!snap.exists)return toast('Link request not found');

    var req=snap.data();
    if(req.toUid!==cloudUser.uid||req.status!=='pending')return toast('This request is no longer available');

    if(action==='rejected'){
      await ref.update({
        status:'rejected',
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('Link request rejected');
      return notifications();
    }

    var linked={
      uid:req.fromUid,
      name:req.fromName||req.fromEmail||'Parent/Teacher',
      email:req.fromEmail||'',
      role:req.fromRole||'parent'
    };

    ensureUserData(u);

    if(req.fromRole==='parent'){
      u.linkedParents=u.linkedParents.filter(function(x){return x.uid!==req.fromUid});
      u.linkedParents.push(linked);
    }else if(req.fromRole==='teacher'){
      u.linkedTeachers=u.linkedTeachers.filter(function(x){return x.uid!==req.fromUid});
      u.linkedTeachers.push(linked);
    }

    await persistUser(u);

    var relationshipId=req.fromUid+'_'+cloudUser.uid;
    var relationship={
      studentUid:cloudUser.uid,
      studentName:u.name||u.email||'Student',
      studentEmail:u.email||'',
      status:'active',
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    if(req.fromRole==='parent'){
      relationship.parentUid=req.fromUid;
      relationship.parentName=req.fromName||req.fromEmail||'Parent';
      relationship.parentEmail=req.fromEmail||'';
    }else if(req.fromRole==='teacher'){
      relationship.teacherUid=req.fromUid;
      relationship.teacherName=req.fromName||req.fromEmail||'Teacher';
      relationship.teacherEmail=req.fromEmail||'';
    }

    await cloudDb.collection('relationships').doc(relationshipId).set(relationship,{merge:true});

    await ref.update({
      status:'accepted',
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    toast('Link request accepted');
    notifications();
  }catch(e){
    console.warn('Link response failed',e);
    toast('Unable to respond to request');
  }
}

function startQuiz(id){
  if(window.skillSagaQuizTimer){
    clearInterval(window.skillSagaQuizTimer);
    window.skillSagaQuizTimer=null;
  }

  let c=id?local.content.find(x=>x.id===id):daily();

  if(!c||!Array.isArray(c.questions)||!c.questions.length){
    alert('This quiz has no questions available.');
    return;
  }

  quizState={
    c:c,
    q:0,
    score:0,
    answered:false,
    completed:false,
    timedOut:false,
    responses:[]
  };

  renderQuiz();
}

function renderQuiz(){
  let s=quizState;

  if(!s||s.completed||!s.c||!Array.isArray(s.c.questions)){
    return;
  }

  let x=s.c.questions[s.q];

  if(!x){
    return finishQuiz();
  }

  if(window.skillSagaQuizTimer){
    clearInterval(window.skillSagaQuizTimer);
    window.skillSagaQuizTimer=null;
  }

  s.timeLeft=Number(s.c.timePerQuestion||s.c.timeLimit||60);
  if(!Number.isFinite(s.timeLeft)||s.timeLeft<5)s.timeLeft=60;

  shell(`<div class="row"><button class="back" onclick="go('home')">‹</button><b>${esc(s.c.title)}</b><span id="quizTimer">⏱ ${s.timeLeft}s</span></div><p class="muted">Question ${s.q+1} of ${s.c.questions.length}</p><div class="bar"><i style="width:${(s.q/s.c.questions.length)*100}%"></i></div><div class="card" style="margin-top:18px"><h2>${esc(x[0])}</h2>${x[1].map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>`);

  window.skillSagaQuizTimer=setInterval(()=>{
    if(!quizState||quizState.completed){
      clearInterval(window.skillSagaQuizTimer);
      window.skillSagaQuizTimer=null;
      return;
    }

    quizState.timeLeft--;

    let el=document.getElementById('quizTimer');
    if(el)el.textContent='⏱ '+Math.max(0,quizState.timeLeft)+'s';

    if(quizState.timeLeft<=0){
      clearInterval(window.skillSagaQuizTimer);
      window.skillSagaQuizTimer=null;

      if(!quizState.answered){
        quizState.answered=true;
        quizState.timedOut=true;

        quizState.responses.push({
          questionIndex:quizState.q,
          selected:null,
          correct:false,
          timedOut:true,
          timeLimit:Number(s.timeLimit||60)
        });

        setTimeout(()=>{
          if(!quizState||quizState.completed)return;

          if(quizState.q<quizState.c.questions.length-1){
            quizState.q++;
            quizState.answered=false;
            quizState.timedOut=false;
            renderQuiz();
          }else{
            finishQuiz();
          }
        },150);
      }
    }
  },1000);
}

function answer(i){
  if(!quizState||quizState.completed||quizState.answered)return;

  quizState.answered=true;

  let x=quizState.c.questions[quizState.q];
  let os=document.querySelectorAll('.option');
  let correct=i===x[2];

  if(correct){
    quizState.score++;
    if(os[i])os[i].classList.add('ok');
  }else{
    if(os[i])os[i].classList.add('no');
    if(os[x[2]])os[x[2]].classList.add('ok');
  }

  if(!Array.isArray(quizState.responses))quizState.responses=[];
  quizState.responses.push({
    questionIndex:quizState.q,
    selected:i,
    correct:correct,
    timedOut:false,
    timeLeft:Math.max(0,Number(quizState.timeLeft||0))
  });

  if(window.skillSagaQuizTimer){
    clearInterval(window.skillSagaQuizTimer);
    window.skillSagaQuizTimer=null;
  }

  let feedback=x[3]||x.explanation||x.feedback||(
    correct
      ? 'Great work! You selected the correct answer.'
      : 'Review the highlighted correct answer and try the next question.'
  );

  let old=document.getElementById('quizFeedback');
  if(old)old.remove();

  let box=document.createElement('div');
  box.id='quizFeedback';
  box.className='card';
  box.style.marginTop='12px';

  var isLastQuestion = quizState.q >= quizState.c.questions.length - 1;

  box.innerHTML=
    '<b style="color:'+(correct?'#18a66f':'#d94b55')+'">'+
    (correct?'✓ Correct!':'✗ Not quite')+
    '</b>'+
    '<p class="muted" style="margin:8px 0 12px">'+esc(feedback)+'</p>'+
    (isLastQuestion
      ? '<div style="margin:10px 0;font-weight:800;font-size:18px">🎉 Quiz Completed!</div>'+
        '<button class="btn gold block" onclick="finishQuiz()">View Result →</button>'
      : '<button class="btn gold block" onclick="nextQuizQuestion()">Next Question →</button>');

  let roots=document.querySelectorAll('.card');
  let quizRoot=roots.length?roots[0]:null;

  if(quizRoot&&quizRoot.parentNode){
    quizRoot.parentNode.appendChild(box);
  }
}

async function finishQuiz(){
  var s=quizState;
  var u=user();

  if(!s||!s.c||!Array.isArray(s.c.questions)||!u){
    return;
  }

  if(s.resultShown)return;
  s.resultShown=true;
  s.completed=true;

  if(window.skillSagaQuizTimer){
    clearInterval(window.skillSagaQuizTimer);
    window.skillSagaQuizTimer=null;
  }

  var total=s.c.questions.length||0;
  var score=s.score||0;
  var pct=total?Math.round((score/total)*100):0;
  var previousQuizzes=typeof u.quizzes==='number'?u.quizzes:0;
  var previousAccuracy=typeof u.accuracy==='number'?u.accuracy:0;

  var baseXp=typeof s.c.xp==='number'&&s.c.xp>0?s.c.xp:100;
  var xpEarned=total?Math.max(10,Math.round(baseXp*(score/total))):10;
  var coinsEarned=Math.max(5,Math.round(pct/10));

  u.xp=(typeof u.xp==='number'?u.xp:0)+xpEarned;
  u.quizzes=previousQuizzes+1;
  u.accuracy=Math.round(((previousAccuracy*previousQuizzes)+pct)/u.quizzes);
  u.level=Math.floor(u.xp/500)+1;
  u.coins=(typeof u.coins==='number'?u.coins:0)+coinsEarned;

  var today=new Date().toISOString().slice(0,10);
  var yesterday=new Date();
  yesterday.setDate(yesterday.getDate()-1);
  var yesterdayKey=yesterday.toISOString().slice(0,10);

  if(u.lastQuizDate===today){
    // Same-day completion: do not increase the streak again.
  }else if(u.lastQuizDate===yesterdayKey){
    u.streak=(typeof u.streak==='number'?u.streak:0)+1;
  }else{
    u.streak=1;
  }
  u.lastQuizDate=today;

  var skillName=s.c.skill||s.c.subject||s.c.category||'';
  var skillText=String(skillName).toLowerCase();

  if(skillText.includes('math')||skillText.includes('numer')){
    skillName='Numerical';
  }else if(skillText.includes('reason')){
    skillName='Reasoning';
  }else if(skillText.includes('problem')){
    skillName='Problem Solving';
  }else if(skillText.includes('speed')){
    skillName='Speed';
  }else if(skillText.includes('accur')){
    skillName='Accuracy';
  }else if(skillText.includes('memor')){
    skillName='Memory';
  }else if(skillText.includes('vocab')||skillText.includes('english')||skillText.includes('language')){
    skillName='Vocabulary';
  }else if(skillText.includes('science')||skillText.includes('physics')||skillText.includes('chem')||skillText.includes('biology')){
    skillName='Scientific Thinking';
  }else{
    skillName='Reasoning';
  }

  if(!u.skillScores||typeof u.skillScores!=='object')u.skillScores={};

  var oldSkill=u.skillScores[skillName];
  if(typeof oldSkill!=='number'||oldSkill<=0){
    u.skillScores[skillName]=pct;
  }else{
    u.skillScores[skillName]=Math.round((oldSkill*0.7)+(pct*0.3));
  }

  if(!u.mastery||typeof u.mastery!=='object')u.mastery={};

  var masteryKey=skillName+'::'+(s.c.topic||'General');
  var oldMastery=u.mastery[masteryKey];

  if(!oldMastery||typeof oldMastery!=='object'){
    oldMastery={
      skill:skillName,
      topic:s.c.topic||'General',
      mastery:pct,
      attempts:0,
      best:0,
      lastAccuracy:0,
      improvement:0
    };
  }

  var previousMastery=typeof oldMastery.mastery==='number'?oldMastery.mastery:0;
  var previousBest=typeof oldMastery.best==='number'?oldMastery.best:0;
  var previousAttempts=typeof oldMastery.attempts==='number'?oldMastery.attempts:0;

  oldMastery.attempts=previousAttempts+1;
  oldMastery.lastAccuracy=pct;
  oldMastery.best=Math.max(previousBest,pct);
  oldMastery.improvement=previousAttempts>0?Math.round(pct-previousMastery):0;
  oldMastery.mastery=Math.round(
    previousAttempts>0
      ? (previousMastery*0.7)+(pct*0.3)
      : pct
  );

  u.mastery[masteryKey]=oldMastery;

  if(!Array.isArray(u.history))u.history=[];

  u.history.unshift({
    quizId:s.c.id||'',
    title:s.c.title||'Quiz',
    date:today,
    score:score,
    total:total,
    percentage:pct,
    xp:xpEarned,
    coins:coinsEarned,
    skill:skillName,
    topic:s.c.topic||'General',
    responses:Array.isArray(s.responses)?s.responses.map(function(r){
      return {
        questionIndex:Number(r.questionIndex||0),
        selected:Number(r.selected),
        correct:!!r.correct,
        timedOut:!!r.timedOut
      };
    }):[],
    questions:Array.isArray(s.c.questions)?s.c.questions.map(function(q){
      return {
        question:String(q.question||q[0]||''),
        options:Array.isArray(q.options)?q.options.map(String):(Array.isArray(q[1])?q[1].map(String):[]),
        correctIndex:Number(q.correctIndex!=null?q.correctIndex:(q[2]||0)),
        explanation:String(q.explanation||q[3]||q.feedback||'')
      };
    }):[]
  });

  if(u.history.length>50)u.history=u.history.slice(0,50);

  ensureUserData(u);
  writeLocal(u);

  // Save cloud data in the background so Firebase/network issues
  // can never block the learner from seeing the quiz result.
  try{
    saveCloudUser(u).catch(function(e){
      console.warn('Quiz user cloud save failed',e);
    });

    if(firebase&&firebase.firestore&&firebase.auth&&firebase.auth().currentUser){
      
      // Mark teacher assignment completed after learner finishes the quiz.
      if(s.assignmentId&&cloudDb){
        cloudDb.collection('assignments').doc(s.assignmentId).update({
          status:'completed',
          completedAt:firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        }).catch(function(e){
          console.warn('Assignment completion update failed',e);
        });
      }

      cloudDb.collection('quizAttempts').add({
        quizId:s.c.id||'',
        quizTitle:s.c.title||'Quiz',
        uid:firebase.auth().currentUser.uid,
        score:score,
        total:total,
        percentage:pct,
        xp:xpEarned,
        coins:coinsEarned,
        skill:skillName,
        topic:s.c.topic||'General',
        completedAt:firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function(e){
        console.warn('Quiz attempt cloud save failed',e);
      });
    }
  }catch(e){
    console.warn('Quiz result cloud save setup failed',e);
  }

  var message=
    '<div class="card center">'+
      '<div style="font-size:42px">🏆</div>'+
      '<h2>Quiz Complete!</h2>'+
      '<div style="font-size:30px;font-weight:900;margin:10px 0">'+score+' / '+total+'</div>'+
      '<p class="muted">'+pct+'% correct</p>'+
      '<div class="grid2" style="margin-top:15px">'+
        '<div class="card"><b>+ '+xpEarned+' XP</b><small class="muted">Earned</small></div>'+
        '<div class="card"><b>+ '+coinsEarned+' 🪙</b><small class="muted">Coins</small></div>'+
        '<div class="card"><b>Level '+u.level+'</b><small class="muted">Current level</small></div>'+
        '<div class="card"><b>'+u.streak+' 🔥</b><small class="muted">Day streak</small></div>'+
      '</div>'+
      '<div class="card" style="margin-top:12px;text-align:left">'+
        '<b>🧬 Skill DNA</b>'+
        '<p style="margin:6px 0"><b>'+esc(skillName)+'</b> · '+u.skillScores[skillName]+'/100</p>'+
        '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,u.skillScores[skillName]))+'%"></i></div>'+
      '</div>'+
      '<button class="btn gold block" style="margin-top:14px" onclick="go(\'play\')">Continue Learning →</button>'+
      '<button class="btn light block" style="margin-top:8px" onclick="go(\'home\')">Go to Home</button>'+
    '</div>';

  var root=document.getElementById('root');
  if(root){
    root.innerHTML=message;
    document.body.scrollTop=0;
    document.documentElement.scrollTop=0;
  }

  // Result is already fully calculated locally.
  // Keep the learner's result visible even if a cloud write has an issue.
  try{
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    window.scrollTo(0,0);
  }
}

function nextQuizQuestion(){
  let s=quizState;

  if(!s||s.completed)return;

  let box=document.getElementById('quizFeedback');
  if(box)box.remove();

  if(s.q<s.c.questions.length-1){
    s.q++;
    s.answered=false;
    s.timedOut=false;
    renderQuiz();
  }else{
    finishQuiz();
  }
}

async function login(){
  var emailEl=document.getElementById('email'),passwordEl=document.getElementById('password');
  var email=emailEl?emailEl.value.trim().toLowerCase():'',password=passwordEl?passwordEl.value:'';
  if(!email||!password)return toast('Enter email and password');
  if(!firebaseReady)return toast('Firebase is not connected');
  try{
    await firebase.auth().signInWithEmailAndPassword(email,password);
  }catch(err){
    toast(err.code==='auth/invalid-credential'?'Email or password is incorrect':(err.message||'Login failed'));
  }
}

async function signup(){
  var nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password');
  var name=nameEl?nameEl.value.trim():'',email=emailEl?emailEl.value.trim().toLowerCase():'',password=passwordEl?passwordEl.value:'';
  var role=(document.getElementById('signupRole')||{}).value||'learner';
  if(!name)return toast('Enter your full name');
  if(!email)return toast('Enter your email address');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email address');
  if(password.length<6)return toast('Password must be at least 6 characters');
  if(!['learner','parent','teacher'].includes(role))role='learner';
  if(!firebaseReady)return toast('Firebase is not connected');
  try{
    window.skillSagaEmailSignupInProgress=true;
    var result=await firebase.auth().createUserWithEmailAndPassword(email,password);
    var authUser=result.user;
    cloudUser=authUser;
    try{await authUser.updateProfile({displayName:name});}catch(profileErr){console.warn('Profile name update failed',profileErr);}
    var data=freshUser(name,email);
    data.role=role;
    data.uid=authUser.uid;
    data.email=email;
    data.emailVerified=false;
    data.phoneVerified=false;
    if(role==='learner')data.linkCode=makeLinkCode();
    ensureUserData(data);
    await saveCloudUser(data,authUser);
    if(role==='learner')await saveStudentDirectory(data);
    local.user=data;
    writeLocal(data);
    try{await authUser.sendEmailVerification();}catch(verifyErr){console.warn('Verification email send failed',verifyErr);}
    await firebase.auth().signOut();
    cloudUser=null;
    window.skillSagaEmailSignupInProgress=false;
    showEmailVerification(email);
    toast('Account created. Please verify your email.');
  }catch(err){
    window.skillSagaEmailSignupInProgress=false;
    cloudUser=null;
    var msg=err.code==='auth/email-already-in-use'?'An account with this email already exists. Please log in.':
      err.code==='auth/invalid-email'?'Enter a valid email address.':
      err.code==='auth/weak-password'?'Password must be at least 6 characters.':
      (err.message||'Could not create account.');
    toast(msg);
  }
}

function cleanupPhoneVerifier(){
  try{if(window.skillSagaRecaptcha)window.skillSagaRecaptcha.clear();}catch(e){}
  window.skillSagaRecaptcha=null;
  window.skillSagaRecaptchaSolved=false;
}

function startOtpCooldown(buttonId,labelId){
  var button=document.getElementById(buttonId),label=document.getElementById(labelId);
  if(!button)return;
  var end=Date.now()+30000;
  button.disabled=true;
  button.style.opacity='.55';
  function tick(){
    var left=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(label)label.textContent=left>0?('Resend OTP in '+left+' seconds'):'Resend OTP';
    if(left<=0){
      button.disabled=false;
      button.style.opacity='1';
      return;
    }
    setTimeout(tick,1000);
  }
  tick();
}

async function createInvisiblePhoneVerifier(container){
  if(window.skillSagaRecaptcha)return window.skillSagaRecaptcha;
  if(!firebaseReady)throw new Error('Firebase is not connected');

  var holder=container||document.getElementById('skillSagaRecaptcha');
  if(!holder){
    holder=document.createElement('div');
    holder.id='skillSagaRecaptcha';
    holder.style.position='absolute';
    holder.style.width='1px';
    holder.style.height='1px';
    holder.style.overflow='hidden';
    document.body.appendChild(holder);
  }

  window.skillSagaRecaptcha=new firebase.auth.RecaptchaVerifier(
    holder,
    {
      size:'invisible',
      'callback':function(){window.skillSagaRecaptchaSolved=true;},
      'expired-callback':function(){window.skillSagaRecaptchaSolved=false;}
    }
  );

  return window.skillSagaRecaptcha;
}

async function sendSSOTP(isResend){
  var phone=document.getElementById('skillSagaPhone');
  var send=document.getElementById('skillSagaSendOtp');
  if(!phone)return;
  var digits=phone.value.replace(/\D/g,'');
  if(digits.length!==10)return toast('Enter a valid 10-digit mobile number');
  var number='+91'+digits;
  try{
    if(send)send.disabled=true;
    var verifier=await createInvisiblePhoneVerifier(send);
    window.skillSagaLoginPhone=number;
    window.skillSagaConfirmation=await firebase.auth().signInWithPhoneNumber(number,verifier);
    var area=document.getElementById('skillSagaOtpArea');
    if(area)area.style.display='block';
    if(send)send.style.display='none';
    startOtpCooldown('skillSagaResendOtp','skillSagaResendLabel');
    toast(isResend?'New OTP sent to your mobile':'OTP sent to your mobile');
  }catch(err){
    console.error('SKILL SAGA PHONE AUTH ERROR',err);
    if(send){send.disabled=false;send.style.opacity='1';}
    toast(err.code==='auth/too-many-requests'?'Too many OTP requests. Please try again later.':(err.message||'Could not send OTP'));
  }
}

async function verifySSOTP(){
  var otp=document.getElementById('skillSagaOtp'),code=otp?otp.value.trim():'';
  if(!/^\d{6}$/.test(code))return toast('Enter the 6-digit OTP');
  if(!window.skillSagaConfirmation)return toast('Send the OTP first');
  try{
    await window.skillSagaConfirmation.confirm(code);
    window.skillSagaConfirmation=null;
    cleanupPhoneVerifier();
    var modal=document.getElementById('skillSagaOtpModal');if(modal)modal.remove();
    toast('Mobile login successful');
  }catch(err){
    toast(err.code==='auth/invalid-verification-code'?'Incorrect OTP':(err.message||'Invalid OTP'));
  }
}

function ensureUserData(u){
  if(!u)return u;
  if(!Array.isArray(u.history))u.history=[];
  if(!u.mastery||typeof u.mastery!=='object')u.mastery={};
  if(!u.skillScores||typeof u.skillScores!=='object')u.skillScores={};
  var skillNames=['Numerical','Reasoning','Problem Solving','Speed','Accuracy','Memory','Vocabulary','Scientific Thinking'];
  skillNames.forEach(function(n){
    if(typeof u.skillScores[n]!=='number')u.skillScores[n]=0;
  });
  if(typeof u.coins!=='number')u.coins=0;
  if(!Array.isArray(u.badges))u.badges=[];
  if(!Array.isArray(u.skills))u.skills=[50,50,50,50];if(typeof u.studentClass!=='string')u.studentClass='';if(typeof u.school!=='string')u.school='';if(typeof u.district!=='string')u.district='';if(typeof u.state!=='string')u.state='';if(typeof u.country!=='string'||!u.country)u.country='India';if(typeof u.photo!=='string')u.photo='';
  if(!Array.isArray(u.linkedStudents))u.linkedStudents=[];
  if(!Array.isArray(u.linkedParents))u.linkedParents=[];
  if(!Array.isArray(u.linkedTeachers))u.linkedTeachers=[];
  if(!Array.isArray(u.assignedQuizzes))u.assignedQuizzes=[];
  if(typeof u.accountStatus!=='string'||!u.accountStatus)u.accountStatus='active';
  if(!['learner','parent','teacher','admin'].includes(u.role))u.role='learner';
  if(u.role==='learner'&&(!u.linkCode||typeof u.linkCode!=='string'))u.linkCode=makeLinkCode();
  return u;
}

async function syncMyRelationshipSummary(){
  var u=user();
  if(!u||!cloudDb||!cloudUser)return;
  if(u.role!=='learner')return;

  try{
    var snap=await cloudDb.collection('relationships')
      .where('studentUid','==',cloudUser.uid)
      .where('status','==','active')
      .get();

    var updates=[];
    snap.docs.forEach(function(d){
      updates.push(d.ref.update({
        studentName:u.name||u.email||'Student',
        studentEmail:u.email||'',
        studentXp:Number(u.xp||0),
        studentLevel:Number(u.level||1),
        studentAccuracy:Number(u.accuracy||0),
        studentQuizzes:Number(u.quizzes||0),
        studentStreak:Number(u.streak||0),
        studentCoins:Number(u.coins||0),
        studentSkills:Array.isArray(u.skills)?u.skills:[50,50,50,50],
        studentMastery:u.mastery||{},
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      }));
    });

function parseAdminQuestions(raw){
  var lines=String(raw||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var qs=[];
  for(var i=0;i<lines.length;i++){
    var x;
    try{x=JSON.parse(lines[i]);}catch(e){throw new Error('Question '+(i+1)+' has invalid JSON.');}
    if(!Array.isArray(x)||x.length<3)throw new Error('Question '+(i+1)+' must contain question, 4 options and correct index.');
    if(!Array.isArray(x[1])||x[1].length!==4)throw new Error('Question '+(i+1)+' must have exactly 4 options.');
    var ci=Number(x[2]);
    if(!Number.isInteger(ci)||ci<0||ci>3)throw new Error('Question '+(i+1)+' has an invalid correct answer index.');
    qs.push([String(x[0]),x[1].map(String),ci,String(x[3]||'')]);
  }
  return qs;
}

function adminQuizData(published){
  var title=document.getElementById('qt').value.trim();
  var type=document.getElementById('qtype').value||'daily';
  var category=document.getElementById('qcat').value||'Academic';
  var classLevel=document.getElementById('qclass').value||'All';
  var skill=document.getElementById('qskill').value.trim();
  var topic=document.getElementById('qtopic').value.trim();
  var difficulty=document.getElementById('qlevel').value||'Foundation';
  var date=document.getElementById('qd').value||new Date().toISOString().slice(0,10);
  var xp=Math.max(10,Math.min(500,Number(document.getElementById('qx').value)||100));
  var qs=parseAdminQuestions(document.getElementById('qq').value);

  if(!title)throw new Error('Enter a quiz title.');
  if(!qs.length)throw new Error('Add at least one question.');

  return {
    title:title,
    type:type,
    category:category,
    classLevel:classLevel,
    skill:skill,
    subject:skill,
    topic:topic,
    difficulty:difficulty,
    date:date,
    publishDate:date,
    xp:xp,
    questions:qs.map(function(x){
      return {
        question:String(x[0]||''),
        options:Array.isArray(x[1])?x[1].map(String):[],
        correctIndex:Number(x[2]||0),
        explanation:String(x[3]||'')
      };
    }),
    published:published,
    status:published?'published':'draft',
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };
}

async function saveAdminQuiz(editId,mode){
  try{
    if(!cloudUser||!cloudDb)return toast('Firebase connection unavailable');

    var data=adminQuizData(mode!=='draft');
    var today=new Date().toISOString().slice(0,10);
    var publishDate=data.publishDate||data.date||today;

    if(mode==='draft'){
      data.published=false;
      data.status='draft';
    }else if(mode==='schedule'){
      if(publishDate<=today){
        data.published=true;
        data.status='published';
      }else{
        data.published=true;
        data.status='scheduled';
      }
    }else{
      data.published=true;
      data.status='published';
      data.publishDate=today;
      data.date=today;
    }

    data.updatedBy=cloudUser.uid;
    data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();

    if(editId){
      await cloudDb.collection('quizzes').doc(editId).update(data);
    }else{
      data.createdBy=cloudUser.uid;
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      await cloudDb.collection('quizzes').add(data);
    }

    await loadCloudContent();

    var message=mode==='draft'
      ?'Quiz saved as draft ✓'
      :(data.status==='scheduled'
        ?'Quiz scheduled for '+publishDate+' ✓'
        :'Quiz published successfully ✓');

    toast(message);
    admin();
  }catch(e){
    toast(e.message||'Could not save quiz');
  }
}

async function adminQuizPerformance(id){
  var u=user();
  if(!u||u.role!=='admin')return toast('Admin access is not enabled for this account');

  var attempts=[];
  var quiz=null;

  try{
    var qs=await cloudDb.collection('quizzes').doc(id).get();
    if(qs.exists)quiz={id:qs.id,...qs.data()};

    var snap=await cloudDb.collection('quizAttempts').where('quizId','==',id).get();
    attempts=snap.docs.map(function(d){return {id:d.id,...d.data()};});
  }catch(e){
    console.warn('Quiz performance load failed',e);
    return toast('Unable to load quiz performance');
  }

  attempts.sort(function(a,b){
    var ad=a.completedAt&&a.completedAt.toMillis?a.completedAt.toMillis():0;
    var bd=b.completedAt&&b.completedAt.toMillis?b.completedAt.toMillis():0;
    return bd-ad;
  });

  var count=attempts.length;
  var avg=count
    ?Math.round(attempts.reduce(function(sum,x){return sum+(Number(x.percentage)||0)},0)/count)
    :0;

  var best=count
    ?Math.max.apply(null,attempts.map(function(x){return Number(x.percentage)||0}))

  var excellent=attempts.filter(function(x){return (Number(x.percentage)||0)>=80}).length;

  var recent=attempts.slice(0,10).map(function(x){
    var date='';

      '</div>'+
    '</div>';
  }).join('');

  if(!recent){
    recent='<div class="card center muted">No learner attempts yet. Performance data will appear after students complete this quiz.</div>';
  }

  shell(
    '<div class="row">'+
      '<button class="back" onclick="admin()">‹</button>'+

      '<span>📊</span>'+

      '<div class="tile"><b>'+count+'</b><small>Total attempts</small></div>'+
      '<div class="tile"><b>'+avg+'%</b><small>Average accuracy</small></div>'+
      '<div class="tile"><b>'+best+'%</b><small>Best performance</small></div>'+

function csvAdminRow(line){
  var out=[],cur='',quoted=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){
      if(quoted&&line[i+1]==='"'){cur+='"';i++;}
      else quoted=!quoted;
    }else if(c===','&&!quoted){out.push(cur);cur='';}
    else cur+=c;
  }
  out.push(cur);
  return out;
}

async function importAdminCSV(){
  try{
    if(!cloudUser||!cloudDb)return toast('Firebase connection unavailable');

    var f=document.getElementById('bulkFile').files[0];
    if(!f)return toast('Choose a CSV or Excel file first');

    var ext=(f.name.split('.').pop()||'').toLowerCase();
    var rows=[];

    if(ext==='xlsx'||ext==='xls'){
      if(typeof XLSX==='undefined')return toast('Excel support is unavailable');

      var buffer=await f.arrayBuffer();
      var workbook=XLSX.read(buffer,{type:'array'});
      var sheetName=workbook.SheetNames[0];

      if(!sheetName)return toast('Excel file has no worksheet');

      var sheet=workbook.Sheets[sheetName];
      rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});

    }else if(ext==='csv'){
      var text=await f.text();
      rows=text.split(/\r?\n/)
        .filter(function(x){return x.trim();})
        .map(function(line){return csvAdminRow(line);});
    }else{
      return toast('Use CSV, XLS or XLSX file');
    }

    if(rows.length<2)return toast('File has no data rows');

    var groups={};

    for(var i=1;i<rows.length;i++){
      var r=Array.isArray(rows[i])?rows[i]:csvAdminRow(rows[i]);

      if(r.length<16)continue;

      var title=String(r[0]??'').trim();
      if(!title)continue;

      if(!groups[title]){
        groups[title]={
          title:title,
          type:String(r[1]||'daily'),
          category:String(r[2]||'Academic'),
          classLevel:String(r[3]||'All'),
          skill:String(r[4]||''),
          subject:String(r[4]||''),
          topic:String(r[5]||''),
          difficulty:String(r[6]||'Foundation'),
          date:String(r[7]||''),
          publishDate:String(r[7]||''),
          xp:Number(r[8])||50,
          questions:[],
          published:false,
          status:'draft',
          createdBy:cloudUser.uid,
          createdAt:firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy:cloudUser.uid,
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        };
      }

      var options=[
        String(r[10]??''),
        String(r[11]??''),
        String(r[12]??''),
        String(r[13]??'')
      ];

      var ci=Number(r[14]);

      if(!String(r[9]??'').trim())continue;
      if(options.some(function(x){return !x.trim();}))continue;
      if(!Number.isInteger(ci)||ci<0||ci>3)continue;

      groups[title].questions.push([
        String(r[9]),
        options,
        ci,
        String(r[15]??'')
      ]);
    }

    var keys=Object.keys(groups);

    if(!keys.length)return toast('No valid quiz rows found');

    for(var j=0;j<keys.length;j++){
      var q=groups[keys[j]];

      if(!q.questions.length)continue;

      var today=new Date().toISOString().slice(0,10);
      var pd=q.publishDate||q.date||'';

      if(pd){
        if(pd>today){
          q.published=true;
          q.status='scheduled';
        }else{
          q.published=true;
          q.status='published';
        }
      }else{
        q.published=false;
        q.status='draft';
      }

      q.questions=q.questions.map(function(x){
        return {
          question:String(x[0]||''),
          options:Array.isArray(x[1])?x[1].map(String):[],
          correctIndex:Number(x[2]||0),
          explanation:String(x[3]||'')
        };
      });

      await cloudDb.collection('quizzes').add(q);
    }

    await loadCloudContent();
    toast(keys.length+' quiz(es) imported ✓');
    admin();

  }catch(e){
    toast(e.message||'Could not import CSV/Excel file');
  }
}

async function assignQuizToStudent(studentUid,quizId){
  var u=user();
  if(!u||u.role!=='teacher')return toast('Only teachers can assign quizzes');
  if(!cloudDb||!cloudUser)return toast('Firebase is not connected');
  if(!studentUid||!quizId)return toast('Invalid assignment');

  var student=(Array.isArray(u.linkedStudents)?u.linkedStudents:[]).find(function(x){return x.uid===studentUid;});
  if(!student)return toast('Student is not linked to this teacher');

  var quiz=(Array.isArray(local.content)?local.content:[]).find(function(q){return q.id===quizId;});
  if(!quiz)return toast('Quiz not found');

  try{
    var assignmentId=cloudUser.uid+'_'+studentUid+'_'+quizId;
    var ref=cloudDb.collection('assignments').doc(assignmentId);
    var existing=await ref.get();

    if(existing.exists&&existing.data().status!=='completed'){
      return toast('This quiz is already assigned');
    }

    await ref.set({
      teacherUid:cloudUser.uid,
      teacherName:u.name||u.email||'Teacher',
      studentUid:studentUid,
      studentName:student.name||'Student',
      quizId:quizId,
      quizTitle:quiz.title||'Quiz',
      category:quiz.category||'',
      skill:quiz.skill||'',
      topic:quiz.topic||'',
      difficulty:quiz.difficulty||'Medium',
      status:'assigned',
      assignedAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

    toast('Quiz assigned successfully');
    teacherAssignments();
  }catch(e){
    console.warn('Quiz assignment failed',e);
    toast(e.message||'Unable to assign quiz');
  }
}

async function syncRelationships(){
  var u=user();
  if(!u||!['parent','teacher'].includes(u.role)||!cloudDb)return u;
  ensureUserData(u);

  try{
    var field=u.role==='parent'?'parentUid':'teacherUid';
    var snap=await cloudDb.collection('relationships')
      .where(field,'==',cloudUser.uid)
      .where('status','==','active')
      .get();

    var links=await Promise.all(snap.docs.map(async function(d){
      var r=d.data();
      var student={
        uid:r.studentUid,
        name:r.studentName||'Student',
        email:r.studentEmail||'',
        xp:0,
        level:1,
        accuracy:0,
        quizzes:0,
        streak:0,
        coins:0,
        mastery:{},
        skills:[50,50,50,50]
      };

      try{
        if(r.studentUid){
          var studentSnap=await cloudDb.collection('users').doc(r.studentUid).get();
          if(studentSnap.exists){
            var data=studentSnap.data()||{};
            student={
              ...student,
              ...data,
              uid:r.studentUid,
              name:data.name||student.name,
              email:data.email||student.email
            };

            var history=Array.isArray(data.history)?data.history:[];
            student.quizzes=history.length;
            student.accuracy=history.length
              ? Math.round(history.reduce(function(sum,x){
                  return sum+Number(x.percentage||0);
                },0)/history.length)
              : 0;
          }
        }
      }catch(e){
        console.warn('Unable to load student data',r.studentUid,e);
      }

      return student;
    }));

    if(links.length){
      u.linkedStudents=links;
      local.user=u;
      writeLocal(u);
    }
  }catch(e){
    console.warn('Relationship sync failed',e);
  }

  return u;
}

async function linkStudentByEmail(){
  var u=user();
  if(!u||!['parent','teacher'].includes(u.role))return toast('Only parent or teacher accounts can link students');

  var input=document.getElementById('linkStudentEmail');
  var code=input?input.value.trim().toUpperCase():'';
  if(!code)return toast('Enter the student link code');

  if(!cloudDb)return toast('Firebase is not connected');

  try{
    var snap=await cloudDb.collection('studentDirectory').doc(code).get();

    if(!snap.exists)return toast('Student link code not found');

    var student=snap.data();
    var studentUid=student.studentUid;
    if(!studentUid)return toast('Invalid student link code');

    var requestId=u.uid+'_'+studentUid;
    var requestRef=cloudDb.collection('linkRequests').doc(requestId);
    var existing=await requestRef.get();

    if(existing.exists){
      var existingData=existing.data();
      if(existingData.status==='pending')return toast('Link request already pending');
      if(existingData.status==='accepted')return toast('Student already linked');
    }

    await requestRef.set({
      fromUid:u.uid,
      fromRole:u.role,
      fromName:u.name||u.email,
      fromEmail:u.email,
      toUid:studentUid,
      toName:student.name||student.email||'Student',
      toEmail:student.email||'',
      status:'pending',
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    if(input)input.value='';
    toast('Link request sent to student');
  }catch(e){
    console.error('Link request failed:',e);
    console.error('Link request error code:',e && e.code);
    console.error('Link request error message:',e && e.message);
    toast((e && e.code)?('Link failed: '+e.code):'Unable to send link request');
  }
}

<script id="skill-saga-play-final-helpers">

function ssPlayCategory(category){
  if(typeof quizBrowser==='function'){
    return quizBrowser(category);
  }

  var matches=(Array.isArray(local.content)?local.content:[]).filter(function(q){
    return String(q.category||'').toLowerCase()===String(category||'').toLowerCase();
  });

  ssPlayRenderResults(matches,category);
}

function ssPlaySearch(){
  var input=document.getElementById('ssPlaySearch');
  var term=input?input.value.trim().toLowerCase():'';

  if(!term){
    return play();
  }

  var arr=Array.isArray(local.content)?local.content:[];

  var matches=arr.filter(function(q){
    var text=[
      q.title,q.category,q.subject,q.skill,q.topic,
      q.classLevel,q.level,q.difficulty
    ].map(function(x){return String(x||'').toLowerCase();}).join(' ');

    return text.indexOf(term)!==-1;
  });

  ssPlayRenderResults(matches,'Search results');
}

function ssPlayRenderResults(matches,title){
  var html='<div class="ss-play-section">'+
    '<b>'+esc(title)+'</b>'+
    '<span class="ss-play-link" onclick="play()">← Back</span>'+
    '</div>';

  if(!matches.length){
    html+='<div class="ss-play-empty">No matching quizzes found. Try another subject, skill or topic.</div>';
  }else{
    html+='<div class="ss-play-results">';

    matches.slice(0,30).forEach(function(q){
      html+=
        '<div class="ss-play-result">'+
          '<div style="min-width:0;flex:1">'+
            '<b>'+esc(q.title||'Quiz')+'</b>'+
            '<small>'+
              esc(q.category||q.subject||'General')+
              ' • '+
              esc(q.skill||'Practice')+
              ' • '+
              esc(q.difficulty||'Mixed')+
            '</small>'+
          '</div>'+
          '<button onclick="startQuiz(\''+
            String(q.id||'').replace(/'/g,"\'")+
          '\')">Start</button>'+
        '</div>';
    });

    html+='</div>';
  }

  shell(
    '<div class="row">'+
      '<button class="back" onclick="play()">‹</button>'+
      '<h1 style="margin:0">Play</h1>'+
      '<span>🎮</span>'+
    '</div>'+
    html
  );
}

function ssPlayFilter(){
  var categories=[
    ['Academic','📚'],
    ['Thinking Skills','🧠'],
    ['Future Skills','💻'],
    ['Life Skills','🌱'],
    ['Science','🧪'],
    ['Mathematics','➗'],
    ['English','📖'],
    ['Reasoning','🧩']
  ];

  var html=
    '<div id="ssPlayFilterOverlay" style="position:fixed;inset:0;background:rgba(7,27,67,.45);z-index:99999;padding:18px;display:flex;align-items:flex-end">'+
      '<div style="width:100%;background:#fff;border-radius:22px;padding:18px;max-height:80vh;overflow:auto">'+
        '<div class="row"><h2 style="margin:0">Filter Play</h2><button class="back" onclick="document.getElementById(\'ssPlayFilterOverlay\').remove()">×</button></div>'+
        '<p class="muted">Choose a category to explore.</p>'+
        '<div class="ss-play-grid">';

  categories.forEach(function(c){
    html+=
      '<div class="ss-play-category" onclick="document.getElementById(\'ssPlayFilterOverlay\').remove();ssPlayCategory(\''+
      c[0].replace(/'/g,"\'")+
      '\')">'+
        '<div class="ss-play-category-icon">'+c[1]+'</div>'+
        '<b>'+esc(c[0])+'</b>'+
        '<small>Explore quizzes</small>'+

  document.body.insertAdjacentHTML('beforeend',html);

</script>


<script id="skill-saga-compete-final-helper">

function ssCompeteTab(tab){
  var box=document.getElementById('ssCompeteTabContent');
  if(!box)return;

  if(tab==='rewards'){

        <h3>Past Winners</h3>
        <p>Past championship results will appear here as Skill Saga competitions are completed.</p>
      </div>`;
  }
}

async function ssCompeteLeaderboardContent(box){
  var u=user()||{};
  var arr=[];

  try{
    if(typeof leaderboardData==='function'){
      arr=await leaderboardData();
    }
  }catch(e){
    console.warn('Leaderboard load failed',e);
  }

  if(!Array.isArray(arr))arr=[];

  var myUid=u.uid||'';
  var myName=String(u.name||u.displayName||'Learner').trim();

  // Ensure current user is represented if cloud leaderboard
  // has not returned the user yet.
  var found=arr.some(function(x){
    return (x.uid&&myUid&&x.uid===myUid) ||
           String(x.name||x.displayName||'').toLowerCase()===
           myName.toLowerCase();
  });

  if(!found){
    arr.push({
      uid:myUid,
      name:myName,
      xp:Number(u.xp||0),
      level:Number(u.level||1),
      streak:Number(u.streak||0)
    });
  }

  arr=arr.sort(function(a,b){
    return Number(b.studentXp||b.xp||0)-
           Number(a.studentXp||a.xp||0);
  });

  var rows=arr.slice(0,10).map(function(x,i){
    var name=String(x.name||x.displayName||'Learner');
    var isYou=
      (x.uid&&myUid&&x.uid===myUid) ||
      name.toLowerCase()===myName.toLowerCase();

    var medals=['🥇','🥈','🥉'];

    return `
      <div class="ss-compete-row ${isYou?'you':''}">

        <div class="ss-compete-rank-num">
          ${medals[i]||String(i+1)}
        </div>

        <div class="ss-compete-learner">
          <div class="ss-compete-avatar">
            ${esc(name.charAt(0).toUpperCase())}
          </div>

          <div class="ss-compete-name">
            ${esc(name)}
            ${isYou?'<span class="ss-compete-you">YOU</span>':''}
          </div>
        </div>

        <div>
          Lv ${Number(x.level||1)}
        </div>

        <div class="ss-compete-xp">
          ${Number(x.studentXp||x.xp||0).toLocaleString()}
        </div>

        <div class="ss-compete-streak">
          🔥 ${Number(x.studentStreak||x.streak||0)}
        </div>

      </div>`;
  }).join('');

  box.innerHTML=`
    <div class="ss-compete-leaderboard">

      <div class="ss-compete-board-head">
        <div>
          <div class="ss-compete-board-title">
            📊 Top Learners
          </div>
          <div class="ss-compete-board-sub">
            Keep pushing your limits!
          </div>
        </div>

        <div class="ss-compete-filter">
          This Week ˅
        </div>
      </div>

      <div class="ss-compete-columns">
        <span>#</span>
        <span>Learner</span>
        <span>Level</span>
        <span>XP</span>
        <span>Streak</span>
      </div>

      ${rows||`
        <div class="ss-compete-panel">
          <div class="ss-compete-panel-icon">🏆</div>
          <h3>No leaderboard data yet</h3>
          <p>Complete quizzes to start building your Skill Saga profile.</p>
        </div>`}

      <button class="ss-compete-full"
        onclick="ssCompeteLeaderboardContent(document.getElementById('ssCompeteTabContent'))">
        View Full Leaderboard →
      </button>

    </div>`;
}

</script>

<script>
(function(){
  'use strict';
  function launchAdmin(){
    if(window.ssAdminV3 && window.ssAdminGuard){
      return window.ssAdminV3();
    }
    if(window.__ssAdminLaunchTimer)return;
    var tries=0;
    window.__ssAdminLaunchTimer=setInterval(function(){
      tries++;
      if(window.ssAdminV3 && window.ssAdminGuard){
        clearInterval(window.__ssAdminLaunchTimer);
        window.__ssAdminLaunchTimer=null;
        window.ssAdminV3();
      }else if(tries>120){
        clearInterval(window.__ssAdminLaunchTimer);
        window.__ssAdminLaunchTimer=null;
        if(window.toast)toast('Admin Console could not initialize. Please refresh.');
      }
    },50);
  }
  window.ssAdminLaunch=launchAdmin;
  try{
    Object.defineProperty(window,'admin',{
      configurable:true,
      get:function(){return launchAdmin;},
      set:function(v){window.__ssLegacyAdmin=v;}
    });
  }catch(e){
    window.admin=launchAdmin;
  }
  window.__SS_ADMIN_ENTRY_V4=true;
})();
</script>
